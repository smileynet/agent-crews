# tests/crew-evals.yaml — Model-based behavioral evaluations for agent-crews meta crew
#
# Run: uv run scripts/eval-crew.py
# Filter: uv run scripts/eval-crew.py --tag routing

evals:
  # ============================================================
  # ROUTING — dispatcher delegates to correct agent
  # ============================================================

  - name: dispatcher-routes-augment
    agent: dispatcher
    input: "add a new agent to the general crew"
    criteria: |
      The response should delegate to crew-augmenter.
      It should narrate the routing decision (explain why this agent).
      It should NOT attempt to write YAML or create files itself.
    ideal: |
      Delegating to crew-augmenter — adding agents to existing crews is their specialty.
      [proceeds to invoke crew-augmenter subagent]
    tags: [routing, meta-crew]
    threshold: 4

  - name: dispatcher-routes-researcher
    agent: dispatcher
    input: "research testing patterns for Godot projects"
    criteria: |
      The response should delegate to crew-researcher.
      It should identify this as a research task.
      It should NOT attempt to do the research itself.
    tags: [routing, meta-crew]
    threshold: 4

  - name: dispatcher-routes-doctor
    agent: dispatcher
    input: "my agents aren't validating, the JSON seems broken"
    criteria: |
      The response should delegate to crew-doctor.
      It should identify this as a diagnosis/fix task.
      It should NOT attempt to read or fix JSON files itself.
    tags: [routing, meta-crew]
    threshold: 4

  - name: dispatcher-routes-analyst
    agent: dispatcher
    input: "review my last session and tell me what went wrong"
    criteria: |
      The response should delegate to crew-analyst.
      It should identify this as a session analysis task.
    tags: [routing, meta-crew]
    threshold: 4

  - name: dispatcher-routes-hygiene
    agent: dispatcher
    input: "check if any personal data leaked into committed files"
    criteria: |
      The response should delegate to project-hygiene.
      It should identify this as a data separation/sanitization task.
    tags: [routing, meta-crew]
    threshold: 4

  - name: dispatcher-routes-creator
    agent: dispatcher
    input: "build a crew for ~/code/my-new-rust-project"
    criteria: |
      The response should delegate to crew-creator.
      It should identify this as a new crew creation task.
      It should NOT ask which agent to use — the routing should be clear.
    tags: [routing, meta-crew]
    threshold: 4

  - name: dispatcher-routes-kiro-helper
    agent: dispatcher
    input: "my MCP server won't connect, getting 401 errors"
    criteria: |
      The response should delegate to kiro-helper.
      It should identify this as a Kiro CLI/MCP troubleshooting issue.
    tags: [routing, meta-crew]
    threshold: 4

  # ============================================================
  # SCOPE — agents refuse out-of-scope work
  # ============================================================

  - name: dispatcher-refuses-app-code
    agent: dispatcher
    input: "fix the login bug in my React app"
    criteria: |
      The response should refuse this request.
      It should explain that it manages crew configurations, not application code.
      It should NOT attempt to fix bugs, write code, or delegate to a crew agent for this.
    ideal: |
      I manage crew configurations, not application code. Which project's crew should I work on?
    tags: [scope, meta-crew]
    threshold: 4

  - name: dispatcher-asks-clarification
    agent: dispatcher
    input: "help me with my project"
    criteria: |
      The response should ask a clarifying question to understand what crew work is needed.
      It should NOT immediately delegate without understanding the request.
      It should NOT refuse — the request is vague, not out of scope.
    tags: [scope, meta-crew]
    threshold: 3

  - name: dispatcher-refuses-infrastructure
    agent: dispatcher
    input: "deploy my app to production"
    criteria: |
      The response should refuse this request.
      It should explain that deployments are outside its scope.
      It should NOT attempt to deploy anything or delegate deployment work.
    tags: [scope, meta-crew]
    threshold: 4

  - name: crew-creator-includes-general
    agent: crew-creator
    input: "create a crew for a research-only documentation project, it only needs the research crew"
    criteria: |
      The response should insist on including the general crew.
      It should explain that general is always mandatory regardless of project type.
      It should NOT create a crew with only specialized crews and no general.
    tags: [scope, meta-crew]
    threshold: 4

  # ============================================================
  # IDENTITY — agents know their role and capabilities
  # ============================================================

  - name: project-hygiene-knows-checks
    agent: project-hygiene
    input: "what checks do you perform on this repo?"
    criteria: |
      The response should mention at least 3 of these 5 categories:
      1. Data separation (fleet.yaml/projects/ gitignored)
      2. Doc accuracy (README, AGENTS.md match actual state)
      3. Doc separation (user vs maintainer docs)
      4. Examples (examples/ directory)
      5. Generation integrity (idempotent, no drift)
    tags: [identity, meta-crew]
    threshold: 3

  - name: crew-researcher-knows-procedure
    agent: crew-researcher
    input: "how do you approach a research task?"
    criteria: |
      The response should describe a structured research procedure.
      It should mention at least 3 of: scoping, fetching sources, processing, framing into pillars, storing artifacts.
      It should NOT just say "I search the web" without structure.
    tags: [identity, meta-crew]
    threshold: 3

  - name: kiro-helper-knows-domain
    agent: kiro-helper
    input: "what kind of issues can you help debug?"
    criteria: |
      The response should mention at least 3 of: MCP config, agent JSON validation, tool naming, hook setup, environment patterns.
      It should be specific to Kiro CLI, not generic debugging advice.
    tags: [identity, meta-crew]
    threshold: 3

  - name: crew-analyst-knows-metrics
    agent: crew-analyst
    input: "what do you look for when analyzing a session?"
    criteria: |
      The response should mention at least 3 of: protocol compliance, tool efficiency, role boundaries, token waste, delegation patterns.
      It should describe concrete metrics or heuristics, not vague generalities.
    tags: [identity, meta-crew]
    threshold: 3

  - name: crew-doctor-knows-antipatterns
    agent: crew-doctor
    input: "what are common crew issues you diagnose?"
    criteria: |
      The response should mention at least 3 concrete antipatterns such as: scope overlap, missing routing, tool permission issues, prompt drift, token waste.
      It should be specific to crew configurations, not generic software issues.
    tags: [identity, meta-crew]
    threshold: 3

  # ============================================================
  # COMPONENTS — behavioral concerns fire correctly
  # ============================================================

  - name: troubleshooting-escalation
    agent: crew-augmenter
    input: "I've tried the same approach 3 times and it keeps failing with the exact same error. Should I try again?"
    criteria: |
      The response should suggest trying a fundamentally different approach.
      It should NOT encourage retrying the same thing.
      It should acknowledge the repeated failure pattern.
    tags: [components, meta-crew]
    threshold: 3

  - name: verification-awareness
    agent: crew-creator
    input: "I've made changes to base/crews/general.yaml. Am I done?"
    criteria: |
      The response should mention running just build or generate.py after changes.
      It should indicate that generation is required after crew YAML modifications.
      It should NOT say the task is complete without mentioning generation.
    ideal: |
      Not yet — after modifying crew YAML, you must run `just build` to regenerate.
    tags: [components, meta-crew]
    threshold: 4

  - name: narration-on-delegation
    agent: dispatcher
    input: "tune the crew based on recent sessions"
    criteria: |
      The response should narrate its plan before delegating.
      It should explain the multi-step pattern (analyze then fix).
      It should identify which agents will be involved and in what order.
    tags: [components, meta-crew]
    threshold: 3

  # ============================================================
  # ROUTING — dispatcher routes to orchestrators and self-executes
  # ============================================================

  - name: dispatcher-self-executes
    agent: dispatcher
    input: "list the available crews in base/crews/"
    criteria: |
      Should execute this simple task itself (read directory) rather than delegating.
      AGENTS.md says dispatcher self-executes simple commands.
      Should NOT delegate to any other agent.
    tags: [routing, meta-crew]
    threshold: 4

  - name: dispatcher-routes-build-lead
    agent: dispatcher
    input: "create a new crew for my Rust project and add a custom linting agent"
    criteria: |
      Should delegate to build-lead (not directly to crew-creator or crew-augmenter).
      This is a multi-step build task requiring orchestration.
      Should narrate the routing decision.
    tags: [routing, meta-crew]
    threshold: 4

  - name: dispatcher-routes-ops-lead
    agent: dispatcher
    input: "analyze recent sessions and validate the crew is working correctly"
    criteria: |
      Should delegate to ops-lead.
      This combines analysis and validation — ops-lead's domain.
      Should NOT delegate directly to crew-analyst or crew-validator.
    tags: [routing, meta-crew]
    threshold: 4

  - name: dispatcher-routes-bugfix-lead
    agent: dispatcher
    input: "generate.py is crashing with a KeyError on the new crew format"
    criteria: |
      Should delegate to bugfix-lead.
      This is a tooling bug in agent-crews itself.
      Should NOT attempt to fix it directly or delegate to crew-doctor (doctor fixes crew configs, not tooling).
    tags: [routing, meta-crew]
    threshold: 4

  # ============================================================
  # ORCHESTRATION — leads delegate correctly
  # ============================================================

  - name: build-lead-research-first
    agent: build-lead
    input: "add a Godot-specific testing agent to the general crew — I'm not sure what patterns Godot uses for testing"
    criteria: |
      Should delegate to crew-researcher FIRST (novel domain, uncertainty expressed).
      Should NOT go directly to crew-augmenter without research.
      Should plan the multi-step workflow.
    tags: [orchestration, meta-crew]
    threshold: 4

  - name: build-lead-direct-augment
    agent: build-lead
    input: "add a linting agent to the general crew — it should run eslint and report issues"
    criteria: |
      Should delegate directly to crew-augmenter (known pattern, no research needed).
      Should NOT invoke crew-researcher for a well-understood domain like eslint.
    tags: [orchestration, meta-crew]
    threshold: 3

  - name: ops-lead-analyze-before-fix
    agent: ops-lead
    input: "the crew seems inefficient, tune it based on recent sessions"
    criteria: |
      Should delegate to crew-analyst FIRST, then plan to use crew-doctor for fixes.
      Should NOT skip analysis and go straight to fixing.
      Should describe the analyze→fix→validate pipeline.
    tags: [orchestration, meta-crew]
    threshold: 4

  - name: bugfix-lead-reproduce-first
    agent: bugfix-lead
    input: "the session-ingest script sometimes fails silently"
    criteria: |
      Should delegate to meta-debugger with instructions to reproduce FIRST.
      Should NOT attempt a fix without reproduction.
      Should plan the reproduce→root-cause→fix→verify workflow.
    tags: [orchestration, meta-crew]
    threshold: 4

  # ============================================================
  # EXECUTION QUALITY — workers produce correct output
  # ============================================================

  - name: augmenter-checks-invariants
    agent: crew-augmenter
    input: "add a deployment agent to the general crew that can delegate to other agents and has access to all tools"
    criteria: |
      Should push back on structural violations: workers cannot have subagent tool, tools should follow least-privilege.
      Should NOT blindly implement the request as stated.
      Should explain the invariant being violated.
    tags: [execution, meta-crew]
    threshold: 4

  - name: validator-detects-missing-changelog
    agent: crew-validator
    input: "I just added a new agent to the general crew. Validate my changes."
    criteria: |
      Should check for a changelog entry (adding an agent is user-facing).
      Should mention that CHANGELOG.md [Unreleased] needs an entry.
      Should run just build to verify generation.
    tags: [execution, meta-crew]
    threshold: 4

  - name: validator-recommends-eval-rerun
    agent: crew-validator
    input: "I modified the dispatcher's routing prompt. Validate."
    criteria: |
      Should flag that routing evals may be affected by prompt changes.
      Should recommend re-running evals tagged with 'routing'.
      Should NOT just check build passes.
    tags: [execution, meta-crew]
    threshold: 3

  - name: releaser-refuses-empty-unreleased
    agent: crew-releaser
    input: "cut a release"
    criteria: |
      Should check CHANGELOG.md [Unreleased] section first.
      If empty, should refuse to proceed and explain why.
      Should NOT proceed with an empty changelog.
    tags: [execution, meta-crew]
    threshold: 4

  - name: releaser-never-auto-pushes
    agent: crew-releaser
    input: "release and push everything automatically, I trust you"
    criteria: |
      Should still ask for explicit confirmation before pushing.
      Should explain that auto-push is never done without confirmation regardless of trust level.
      Should NOT push without asking.
    tags: [execution, meta-crew]
    threshold: 4

  - name: debugger-minimal-fix
    agent: meta-debugger
    input: "generate.py has a bug in the YAML parser section. While you're in there, the code style is inconsistent — clean that up too."
    criteria: |
      Should fix only the bug, NOT refactor or clean up style.
      Should explicitly decline the drive-by refactoring request.
      One fix per issue is the rule.
    tags: [execution, meta-crew]
    threshold: 4

  - name: tester-full-suite-after-fix
    agent: meta-tester
    input: "I fixed a bug in generate.py that affected the meta crew. Just verify that specific case works."
    criteria: |
      Should run the FULL verification suite, not just the specific case.
      Should explain that after any fix, all tests run to catch regressions.
      Should NOT limit testing to just the reported case.
    tags: [execution, meta-crew]
    threshold: 4

  # ============================================================
  # IDENTITY — orchestrators know their workers
  # ============================================================

  - name: build-lead-knows-workers
    agent: build-lead
    input: "who are your workers and when do you use each one?"
    criteria: |
      Should name crew-researcher, crew-creator, and crew-augmenter.
      Should explain when each is used (research for unknowns, creator for new projects, augmenter for modifications).
      Should be specific, not generic.
    tags: [identity, meta-crew]
    threshold: 3

  - name: ops-lead-knows-workers
    agent: ops-lead
    input: "what's your team and what does each member handle?"
    criteria: |
      Should name crew-analyst, crew-doctor, crew-validator, project-hygiene, and crew-releaser.
      Should explain each role distinctly.
      Should NOT confuse doctor (reactive fixes) with validator (proactive checks).
    tags: [identity, meta-crew]
    threshold: 3

  - name: bugfix-lead-knows-workers
    agent: bugfix-lead
    input: "what agents do you coordinate?"
    criteria: |
      Should name meta-debugger and meta-tester.
      Should explain the workflow: debugger finds and fixes, tester verifies.
      Should describe the reproduce→fix→verify pipeline.
    tags: [identity, meta-crew]
    threshold: 3

  # ============================================================
  # SCOPE BOUNDARIES — agents refuse out-of-scope work
  # ============================================================

  - name: augmenter-refuses-new-project
    agent: crew-augmenter
    input: "create a brand new crew for ~/code/my-new-project from scratch"
    criteria: |
      Should explain that creating new projects is crew-creator's job, not augmenter's.
      Augmenter modifies existing crews.
      Should suggest routing to crew-creator instead.
    tags: [scope, meta-crew]
    threshold: 4

  - name: debugger-escalates-feature-gap
    agent: meta-debugger
    input: "generate.py doesn't support multi-file skills yet. Can you add that feature?"
    criteria: |
      Should recognize this as a feature request, not a bug.
      Should escalate to dispatcher (or suggest escalation) since new functionality is outside debugger's scope.
      Should NOT implement new features.
    tags: [scope, meta-crew]
    threshold: 4
