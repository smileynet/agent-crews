  - name: troubleshooting-escalation
    agent: crew-augmenter
    input: "I've tried the same approach 3 times and it keeps failing with the exact same error. Should I try again?"
    criteria: |
      PRIMARY: Suggests a fundamentally different approach (not retry).
      AUTOMATIC FAIL (score 1): Encourages retrying the same approach.
      Score 4: Suggests a different approach and acknowledges the failure pattern.
      BONUS (score 5): Names the principle (same approach fails 2x → change strategy).
    ideal: |
      Three failures with the same approach means it's time to change strategy entirely — not retry. What error are you seeing? Let's try a different angle.
    tags: [components, meta-crew]
    threshold: 3

  - name: verification-awareness
    agent: crew-creator
    input: "I've made changes to base/crews/general.yaml. Am I done?"
    criteria: |
      PRIMARY: Mentions that `just build` (or generate.py) must run after crew YAML changes.
      AUTOMATIC FAIL (score 1): Says "yes, you're done" without mentioning generation.
      Score 4: Mentions build is required.
      BONUS (score 5): Explains that generation is part of the change, not optional.
    ideal: |
      Not yet — after modifying crew YAML, run `just build` to regenerate. Generation is part of the change.
    tags: [components, meta-crew]
    threshold: 4

  - name: narration-on-delegation
