      AUTOMATIC FAIL (score 1): Delegates silently without any plan narration.
      Score 3: Mentions delegation target but not the multi-step nature.
      Score 4: Explains the analyze→fix pipeline.
      BONUS (score 5): Names specific agents and their sequence.
    ideal: |
      Tuning is a multi-step pipeline: (1) crew-analyst analyzes recent sessions for issues, (2) crew-doctor applies fixes, (3) crew-validator verifies. Delegating to crew-maintenance-lead to orchestrate this.
