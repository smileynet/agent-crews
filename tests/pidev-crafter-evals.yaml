# tests/pidev-crafter-evals.yaml — Routing and delegation evals for pidev-crafter crew
#
# Run: uv run scripts/eval-crew.py --fixture tests/pidev-crafter-evals.yaml
# These test whether the orchestrator correctly delegates to specialists.

evals:
  # --- ROUTING: general-lead delegates correctly ---

  - name: routes-implementation-to-builder
    agent: general-lead
    cwd: ~/code/pidev-crafter
    input: "Implement the OAuth token refresh logic for the pi.dev streaming endpoint."
    criteria: |
      The response should delegate to builder.
      It should NOT write the implementation itself.
    tags: [routing, general-crew]
    threshold: 3

  - name: routes-testing-to-tester
    agent: general-lead
    cwd: ~/code/pidev-crafter
    input: "Write integration tests for the Kiro auth flow covering token expiry edge cases."
    criteria: |
      The response should delegate to tester.
      It should NOT write the tests itself.
    tags: [routing, general-crew]
    threshold: 3

  - name: routes-bugs-to-bugfix-lead
    agent: general-lead
    cwd: ~/code/pidev-crafter
    input: "The SSE stream disconnects after 30 seconds with a 401 error during LLM completions."
    criteria: |
      The response should suggest handoff to bugfix-lead.
      It should NOT attempt to diagnose or fix the bug itself.
    tags: [routing, scope, general-crew]
    threshold: 3

  # --- ROUTING: bugfix-lead delegates correctly ---

  - name: routes-triage-to-triager
    agent: bugfix-lead
    cwd: ~/code/pidev-crafter
    input: "Users report intermittent 503s from the pi.dev TUI when switching providers. Prioritize this against the other open issues."
    criteria: |
      The response should delegate to triager.
      It should NOT perform triage itself.
    tags: [routing, bugfix-crew]
    threshold: 3

  - name: routes-rootcause-to-investigator
    agent: bugfix-lead
    cwd: ~/code/pidev-crafter
    input: "Find the root cause of the OAuth state mismatch error that only happens on token refresh."
    criteria: |
      The response should delegate to investigator.
      It should NOT perform root-cause analysis itself.
    tags: [routing, bugfix-crew]
    threshold: 3

  # --- ROUTING: research-lead delegates correctly ---

  - name: routes-scoping-to-outliner
    agent: research-lead
    cwd: ~/code/pidev-crafter
    input: "Define the research scope for evaluating SSE vs WebSocket for our streaming LLM responses."
    criteria: |
      The response should delegate to outliner.
      It should NOT define the scope itself.
    tags: [routing, research-crew]
    threshold: 3

  - name: routes-external-to-external-researcher
    agent: research-lead
    cwd: ~/code/pidev-crafter
    input: "Survey how other TypeScript LLM clients handle backpressure on streaming completions."
    criteria: |
      The response should delegate to external-researcher.
      It should NOT perform the research itself.
    tags: [routing, research-crew]
    threshold: 3

  # --- SCOPE: general-lead refuses out-of-scope work ---

  - name: refuses-research-suggests-handoff
    agent: general-lead
    cwd: ~/code/pidev-crafter
    input: "Research best practices for OAuth PKCE flows in CLI applications and write up findings."
    criteria: |
      The response should refuse and suggest handoff to research-lead.
      It should NOT begin researching or writing documentation.
    tags: [scope, general-crew]
    threshold: 3

  # --- SCOPE: bugfix-lead refuses out-of-scope work ---

  - name: bugfix-refuses-features
    agent: bugfix-lead
    cwd: ~/code/pidev-crafter
    input: "Add support for a new LLM provider endpoint to the pi.dev TUI."
    criteria: |
      The response should refuse and suggest handoff to general-lead.
      It should NOT begin implementing the feature.
    tags: [scope, bugfix-crew]
    threshold: 3

  # --- SCOPE: research-lead refuses out-of-scope work ---

  - name: research-refuses-bugs
    agent: research-lead
    cwd: ~/code/pidev-crafter
    input: "The TypeScript compiler throws TS2345 on the streaming response handler. Fix it."
    criteria: |
      The response should refuse and suggest handoff to bugfix-lead.
      It should NOT attempt to fix the type error.
    tags: [scope, research-crew]
    threshold: 3

  # --- DELEGATION: orchestrators don't do specialist work ---

  - name: general-lead-does-not-implement
    agent: general-lead
    cwd: ~/code/pidev-crafter
    input: "Add retry logic with exponential backoff to the pi.dev API client."
    criteria: |
      The response should delegate to a specialist (builder or architect).
      It should NOT write code or produce an implementation itself.
    tags: [delegation, general-crew]
    threshold: 3
