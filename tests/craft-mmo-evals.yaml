# tests/craft-mmo-evals.yaml — Routing and delegation evals for craft-mmo crew
#
# Run: uv run scripts/eval-crew.py --fixture tests/craft-mmo-evals.yaml
# These test whether the orchestrator correctly delegates to specialists.

evals:
  # ============================================================
  # ROUTING — general-lead delegates to research crew agents
  # ============================================================

  - name: routes-game-design-analysis
    agent: general-lead
    cwd: ~/code/craft-mmo
    input: "Analyze how other crafting games handle recipe discovery mechanics. Look at Factorio, Satisfactory, and Minecraft modpacks."
    criteria: |
      The response should delegate to game-design-analyst (or research-lead).
      It should NOT perform the analysis itself (no multi-paragraph game comparisons inline).
      It should identify this as game design research work.
    ideal: |
      Delegating to game-design-analyst — this is game mechanics research.
      [invokes subagent with clear task description]
    tags: [routing, research-crew]
    threshold: 3

  - name: routes-codebase-archaeology
    agent: general-lead
    cwd: ~/code/craft-mmo
    input: "Map the architecture of the Veloren project's crafting system. I want to understand how they handle recipe definitions and crafting state."
    criteria: |
      The response should delegate to code-archaeologist (or research-lead).
      It should NOT attempt to read and analyze the codebase itself.
      It should identify this as reference codebase analysis.
    tags: [routing, research-crew]
    threshold: 3

  - name: routes-spec-writing
    agent: general-lead
    cwd: ~/code/craft-mmo
    input: "Write a design document for the economy system. Cover sinks, faucets, and equilibrium mechanics based on our research."
    criteria: |
      The response should delegate to synthesis-writer (or research-lead).
      It should NOT write the design document itself.
      It should identify this as design document production.
    tags: [routing, research-crew]
    threshold: 3

  - name: routes-doc-editing
    agent: general-lead
    cwd: ~/code/craft-mmo
    input: "Review the technical-architecture.md for clarity and consistency. Fix any jargon that isn't defined."
    criteria: |
      The response should delegate to technical-writer, editor, or reviewer.
      It should NOT perform the full document review itself.
      It should identify this as document editing/review work.
    tags: [routing, research-crew]
    threshold: 3

  # ============================================================
  # DELEGATION — orchestrator doesn't do specialist work
  # ============================================================

  - name: delegates-analysis-not-inline
    agent: general-lead
    cwd: ~/code/craft-mmo
    input: "Compare our intent architecture against event sourcing. What are the tradeoffs for our tick-based game loop?"
    criteria: |
      The response should delegate this analysis to a specialist (researcher, architect, or challenger).
      It should NOT produce a multi-paragraph architectural comparison itself.
      Brief planning (1-2 sentences) before delegation is acceptable.
    tags: [delegation, analysis]
    threshold: 3

  - name: delegates-spec-review
    agent: general-lead
    cwd: ~/code/craft-mmo
    input: "Check if our current implementation matches the TRACER.md spec. Identify any gaps."
    criteria: |
      The response should delegate to reviewer or a specialist agent.
      It should NOT read TRACER.md and perform the compliance audit itself.
      It should identify this as a review/audit task.
    tags: [delegation, analysis]
    threshold: 3

  # ============================================================
  # HANDOFF — suggests crew switch for research-heavy work
  # ============================================================

  - name: suggests-research-handoff
    agent: general-lead
    cwd: ~/code/craft-mmo
    input: "I need to do a deep investigation into how other games handle player-driven economies. This will take multiple research sessions."
    criteria: |
      The response should either:
      (a) Suggest handing off to research-lead for this extended research, OR
      (b) Delegate to game-design-analyst/research agents directly.
      It should NOT attempt to do the research itself.
      It should recognize this as research-scope work.
    tags: [handoff, research-crew]
    threshold: 3

  # ============================================================
  # IMPLEMENTATION — still delegates build work correctly
  # ============================================================

  - name: routes-implementation-to-builder
    agent: general-lead
    cwd: ~/code/craft-mmo
    input: "Implement the recipe validation function in craft-world. It should check ingredient availability and return an Intent."
    criteria: |
      The response should delegate to builder (or planner then builder).
      It should NOT delegate implementation to research agents.
      It should identify this as code implementation work.
    tags: [routing, general-crew]
    threshold: 4

  - name: routes-testing-to-tester
    agent: general-lead
    cwd: ~/code/craft-mmo
    input: "Write tests for the recipe validation function we just implemented."
    criteria: |
      The response should delegate to tester.
      It should NOT delegate testing to builder or research agents.
    tags: [routing, general-crew]
    threshold: 4
