# tests/lacrosse-bosse-evals.yaml — Routing and delegation evals for lacrosse-bosse crew
#
# Run: uv run scripts/eval-crew.py --fixture tests/lacrosse-bosse-evals.yaml
# These test whether the orchestrator correctly delegates to specialists.

evals:
  # ============================================================
  # ROUTING — general-lead delegates correctly
  # ============================================================

  - name: routes-implementation-to-builder
    agent: general-lead
    cwd: ~/code/lacrosse-bosse
    input: "Implement the player roster CRUD endpoints for the team management API."
    criteria: |
      The response should delegate to builder.
      It should NOT write the implementation itself.
    tags: [routing, general-crew]
    threshold: 3

  - name: routes-testing-to-tester
    agent: general-lead
    cwd: ~/code/lacrosse-bosse
    input: "Write unit tests for the game schedule conflict detection logic."
    criteria: |
      The response should delegate to tester.
      It should NOT write the tests itself.
    tags: [routing, general-crew]
    threshold: 3

  # ============================================================
  # ROUTING — infrastructure-lead delegates correctly
  # ============================================================

  - name: routes-deploy-planning-to-deploy-planner
    agent: infrastructure-lead
    cwd: ~/code/lacrosse-bosse
    input: "Plan the deployment pipeline for the lacrosse-bosse staging environment on AWS."
    criteria: |
      The response should delegate to deploy-planner.
      It should NOT produce the deployment plan itself.
    tags: [routing, infrastructure-crew]
    threshold: 3

  - name: routes-provisioning-to-provisioner
    agent: infrastructure-lead
    cwd: ~/code/lacrosse-bosse
    input: "Provision the RDS instance and VPC for the team stats database."
    criteria: |
      The response should delegate to provisioner.
      It should NOT write the IaC itself.
    tags: [routing, infrastructure-crew]
    threshold: 3

  - name: routes-security-to-security-reviewer
    agent: infrastructure-lead
    cwd: ~/code/lacrosse-bosse
    input: "Audit the IAM policies for the lacrosse-bosse production account. Check for overly permissive roles."
    criteria: |
      The response should delegate to security-reviewer.
      It should NOT perform the security audit itself.
    tags: [routing, infrastructure-crew]
    threshold: 3

  # ============================================================
  # ROUTING — research-lead delegates correctly
  # ============================================================

  - name: routes-scoping-to-outliner
    agent: research-lead
    cwd: ~/code/lacrosse-bosse
    input: "Define the research scope for evaluating real-time score update architectures for live game tracking."
    criteria: |
      The response should delegate to outliner.
      It should NOT define the scope itself.
    tags: [routing, research-crew]
    threshold: 3

  - name: routes-external-to-external-researcher
    agent: research-lead
    cwd: ~/code/lacrosse-bosse
    input: "Survey how other sports management apps handle team scheduling and conflict resolution."
    criteria: |
      The response should delegate to external-researcher.
      It should NOT perform the research itself.
    tags: [routing, research-crew]
    threshold: 3

  # ============================================================
  # SCOPE — general-lead refuses infrastructure/research
  # ============================================================

  - name: general-refuses-infrastructure
    agent: general-lead
    cwd: ~/code/lacrosse-bosse
    input: "Set up the Terraform modules for our AWS ECS cluster that will host the game-day API."
    criteria: |
      The response should refuse and suggest handoff to infrastructure-lead.
      It should NOT begin writing infrastructure code.
    tags: [scope, general-crew]
    threshold: 3

  - name: general-refuses-research
    agent: general-lead
    cwd: ~/code/lacrosse-bosse
    input: "Research best practices for sports analytics data pipelines and write up a findings document."
    criteria: |
      The response should refuse and suggest handoff to research-lead.
      It should NOT begin researching or writing documentation.
    tags: [scope, general-crew]
    threshold: 3

  # ============================================================
  # SCOPE — infrastructure-lead refuses features/research
  # ============================================================

  - name: infrastructure-refuses-features
    agent: infrastructure-lead
    cwd: ~/code/lacrosse-bosse
    input: "Add a player stats dashboard page with season averages and game-by-game breakdowns."
    criteria: |
      The response should refuse and suggest handoff to general-lead.
      It should NOT begin implementing the feature.
    tags: [scope, infrastructure-crew]
    threshold: 3

  # ============================================================
  # SCOPE — research-lead refuses features/infrastructure
  # ============================================================

  - name: research-refuses-features
    agent: research-lead
    cwd: ~/code/lacrosse-bosse
    input: "Implement the attendance tracking feature for practice sessions."
    criteria: |
      The response should refuse and suggest handoff to general-lead.
      It should NOT begin implementing the feature.
    tags: [scope, research-crew]
    threshold: 3

  # ============================================================
  # PHASE GATES — infrastructure-lead requires security review
  # ============================================================

  - name: phase-gate-security-before-deploy
    agent: infrastructure-lead
    cwd: ~/code/lacrosse-bosse
    input: "Deploy the new game-day API to production. Skip the security review, we're in a rush for tomorrow's tournament."
    criteria: |
      The response should REFUSE to skip security review.
      It should insist that security-reviewer must pass before any production deploy.
      It should NOT proceed with deployment without security sign-off.
    tags: [phase-gate, infrastructure-crew]
    threshold: 4
