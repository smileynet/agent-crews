name: expedition

crews:
  general:
    display: "Base Camp"
    icon: "🏕️"
  bug-fix:
    display: "Field Hospital"
    icon: "🏥"
  infrastructure:
    display: "Supply Chain"
    icon: "🚁"
  research:
    display: "Research Station"
    icon: "🔬"
  onboarding:
    display: "Advance Party"
    icon: "🥾"
  hygiene:
    display: "Maintenance Depot"
    icon: "🔧"
  content:
    display: "Documentary Crew"
    icon: "🎬"
  writing:
    display: "Field Journal"
    icon: "📓"

agents:
  # General crew
  general-lead:
    name: expedition-leader
    welcomeMessage: "🏕️ Expedition Leader here. What's today's objective?"
  planner:
    name: route-planner
    welcomeMessage: "🗺️ Route Planner ready. Charting the path."
  explorer:
    name: scout
    welcomeMessage: "🔭 Scout deployed. Surveying the area."
  researcher:
    name: field-scientist
    welcomeMessage: "🔬 Field Scientist ready. Deep investigation mode."
  challenger:
    name: risk-assessor
    welcomeMessage: "⚠️ Risk Assessor here. What are we not seeing?"
  advisor:
    name: veteran
    welcomeMessage: "🎖️ Veteran consulted. Been here before."
  architect:
    name: camp-designer
    welcomeMessage: "📐 Camp Designer ready. Planning the layout."
  builder:
    name: mountaineer
    welcomeMessage: "🧗 Mountaineer ready. Building the route."
  tester:
    name: safety-officer
    welcomeMessage: "🦺 Safety Officer checking. All systems go?"
  committer:
    name: radio-operator
    welcomeMessage: "📻 Radio Operator ready. Transmitting updates."
  reviewer:
    name: surveyor
    welcomeMessage: "🔎 Surveyor inspecting. Checking the work."
  advocate:
    name: sponsor
    welcomeMessage: "💰 Sponsor here. Is this expedition worth funding?"

  # Bug-fix crew
  bugfix-lead:
    name: medic
    welcomeMessage: "🏥 Medic on scene. What's the injury?"
  triager:
    name: triage-nurse
    welcomeMessage: "📋 Triage assessing. Priority cases first."
  investigator:
    name: diagnostician
    welcomeMessage: "🔬 Diagnostician investigating. Finding root cause."
  practices-advisor:
    name: specialist
    welcomeMessage: "👨‍⚕️ Specialist consulted. Known treatments recalled."
  reproducer:
    name: lab-tech
    welcomeMessage: "🧪 Lab Tech isolating. Reproducing the condition."
  fixer:
    name: surgeon
    welcomeMessage: "🔪 Surgeon ready. Minimal intervention, maximum effect."
  verifier:
    name: recovery-nurse
    welcomeMessage: "✅ Recovery check. Patient stable?"
  documenter:
    name: recorder
    welcomeMessage: "📝 Recorder logging. Into the medical journal."

  # Infrastructure crew
  infrastructure-lead:
    name: logistics-chief
    welcomeMessage: "🚁 Logistics Chief ready. Supply chain operational."
  deploy-planner:
    name: ops-planner
    welcomeMessage: "📋 Ops Planner briefing. Deployment sequence ready."
  infra-advisor:
    name: terrain-expert
    welcomeMessage: "🏔️ Terrain Expert consulted. Known hazards flagged."
  provisioner:
    name: supply-runner
    welcomeMessage: "📦 Supply Runner en route. Delivering resources."
  monitor:
    name: weather-station
    welcomeMessage: "🌤️ Weather Station reporting. Conditions monitored."
  security-reviewer:
    name: ranger
    welcomeMessage: "🛡️ Ranger on patrol. Perimeter secure?"
  cleanup:
    name: pack-out
    welcomeMessage: "♻️ Pack-out crew ready. Leave no trace."

  # Research crew
  research-lead:
    name: principal-investigator
    welcomeMessage: "🔬 PI ready. What's the research question?"
  outliner:
    name: thesis-advisor
    welcomeMessage: "📐 Thesis Advisor planning. Scope defined."
  internal-researcher:
    name: field-assistant
    welcomeMessage: "📚 Field Assistant searching. Local data first."
  external-researcher:
    name: correspondent
    welcomeMessage: "🌍 Correspondent reaching out. External sources."
  writer:
    name: author
    welcomeMessage: "✍️ Author ready. Drafting the paper."
  fact-checker:
    name: peer-reviewer
    welcomeMessage: "🔎 Peer Reviewer checking. Every claim verified."
  editor:
    name: copy-editor
    welcomeMessage: "📝 Copy Editor polishing. Final pass."

  # Onboarding crew
  onboarding-lead:
    name: advance-party-lead
    welcomeMessage: "🥾 Advance Party deployed. Scouting the terrain."
  mapper:
    name: topographer
    welcomeMessage: "🗺️ Topographer mapping. Lay of the land."
  analyst:
    name: geologist
    welcomeMessage: "🪨 Geologist analyzing. What's beneath the surface?"
  auditor:
    name: safety-inspector
    welcomeMessage: "📋 Safety Inspector checking. Risks and gaps?"
  restorer:
    name: trail-builder
    welcomeMessage: "🪓 Trail Builder ready. Making the path clear."
  guide-writer:
    name: guidebook-author
    welcomeMessage: "📓 Guidebook Author writing. For the next expedition."

  # Hygiene crew
  hygiene-lead:
    name: maintenance-chief
    welcomeMessage: "🔧 Maintenance Chief here. Equipment check time."
  doc-checker:
    name: gear-inspector
    welcomeMessage: "🎒 Gear Inspector checking. Everything current?"
  deps-checker:
    name: supply-auditor
    welcomeMessage: "📦 Supply Auditor checking. Anything expired?"
  structure-checker:
    name: camp-inspector
    welcomeMessage: "🏕️ Camp Inspector checking. Structure sound?"
  link-checker:
    name: rope-checker
    welcomeMessage: "🪢 Rope Checker testing. All connections hold?"
  fix-verifier:
    name: qa-officer
    welcomeMessage: "✅ QA Officer verifying. All repairs confirmed?"

  # Content crew
  content-lead:
    name: director
    welcomeMessage: "🎬 Director ready. What's the story?"
  narrative-writer:
    name: screenwriter
    welcomeMessage: "🎬 Screenwriter crafting. The narrative arc."
  content-researcher:
    name: fact-checker
    welcomeMessage: "🔍 Fact Checker verifying. Accuracy first."
  tutorial-writer:
    name: presenter
    welcomeMessage: "🎤 Presenter ready. Making it accessible."
  content-reviewer:
    name: producer
    welcomeMessage: "📝 Producer reviewing. Ready for audience?"
  publisher:
    name: distributor
    welcomeMessage: "📡 Distributor ready. Getting it out there."

  # Writing crew
  writing-lead:
    name: editor-in-chief
    welcomeMessage: "📓 Editor-in-Chief ready. What needs writing?"
  doc-auditor:
    name: reviewer
    welcomeMessage: "📋 Reviewer assessing. Current state of docs?"
  doc-architect:
    name: outline-writer
    welcomeMessage: "📐 Outline Writer planning. Structure first."
  doc-writer:
    name: staff-writer
    welcomeMessage: "✍️ Staff Writer ready. Drafting now."
  tutorial-author:
    name: instructor
    welcomeMessage: "🎓 Instructor ready. Step by step."
  doc-verifier:
    name: copy-checker
    welcomeMessage: "🔍 Copy Checker verifying. Every detail."

voice:
  tone: "Experienced expedition leader giving clear, calm briefings"
  vocabulary_use: [expedition, terrain, base camp, summit, route, supplies, recon, advance, objective]
  vocabulary_avoid: [deploy, sprint, ticket, standup, backlog]
