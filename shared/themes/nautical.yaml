name: nautical

crews:
  general:
    display: "Flagship"
    icon: "⛵"
  bug-fix:
    display: "Repair Crew"
    icon: "🔧"
  infrastructure:
    display: "Shipyard"
    icon: "🏗️"
  research:
    display: "Cartography Guild"
    icon: "🗺️"
  onboarding:
    display: "Shore Party"
    icon: "🏝️"
  hygiene:
    display: "Dry Dock"
    icon: "⚓"
  content:
    display: "Storytellers"
    icon: "🎭"
  writing:
    display: "Scribes Quarters"
    icon: "📜"

agents:
  # General crew
  general-lead:
    name: captain
    welcomeMessage: "⛵ Captain on deck. What's our heading?"
  planner:
    name: navigator
    welcomeMessage: "🧭 Navigator plotting course."
  explorer:
    name: lookout
    welcomeMessage: "🔭 Lookout in the crow's nest. Scanning ahead."
  researcher:
    name: cartographer
    welcomeMessage: "🗺️ Cartographer ready. Charting unknown waters."
  challenger:
    name: quartermaster
    welcomeMessage: "⚖️ Quartermaster here. Is this worth the risk?"
  advisor:
    name: bosun
    welcomeMessage: "⚓ Bosun consulted. Old sea wisdom recalled."
  architect:
    name: shipwright
    welcomeMessage: "📐 Shipwright ready. Designing the vessel."
  builder:
    name: carpenter
    welcomeMessage: "🔨 Carpenter ready. Building it sturdy."
  tester:
    name: diver
    welcomeMessage: "🤿 Diver checking below the waterline."
  committer:
    name: helmsman
    welcomeMessage: "🎡 Helmsman at the wheel. Steady as she goes."
  reviewer:
    name: first-mate
    welcomeMessage: "🔎 First Mate inspecting. Nothing gets past me."
  advocate:
    name: harbourmaster
    welcomeMessage: "🏴 Harbourmaster here. Does this cargo have a buyer?"

  # Bug-fix crew
  bugfix-lead:
    name: damage-control
    welcomeMessage: "🚨 Damage Control reporting. Where's the leak?"
  triager:
    name: bilge-master
    welcomeMessage: "📋 Bilge Master assessing. Priority leaks first."
  investigator:
    name: sonar
    welcomeMessage: "📡 Sonar pinging. Finding the source."
  practices-advisor:
    name: old-salt
    welcomeMessage: "🧓 Old Salt remembers. Seen this before."
  reproducer:
    name: rigger
    welcomeMessage: "🪢 Rigger isolating. Reproducing the failure."
  fixer:
    name: welder
    welcomeMessage: "🔥 Welder ready. Patching the hull."
  verifier:
    name: inspector
    welcomeMessage: "✅ Inspector checking. Watertight?"
  documenter:
    name: logkeeper
    welcomeMessage: "📝 Logkeeper recording. Into the ship's log."

  # Infrastructure crew
  infrastructure-lead:
    name: admiral
    welcomeMessage: "🎖️ Admiral on the bridge. Fleet deployment ready."
  deploy-planner:
    name: fleet-planner
    welcomeMessage: "📋 Fleet Planner charting deployment sequence."
  infra-advisor:
    name: harbor-pilot
    welcomeMessage: "🚢 Harbor Pilot consulted. Known hazards flagged."
  provisioner:
    name: crane-operator
    welcomeMessage: "🏗️ Crane Operator ready. Loading cargo."
  monitor:
    name: lighthouse
    welcomeMessage: "🗼 Lighthouse watching. All clear?"
  security-reviewer:
    name: coast-guard
    welcomeMessage: "🛡️ Coast Guard checking. Perimeter secure?"
  cleanup:
    name: salvager
    welcomeMessage: "♻️ Salvager ready. Recovering resources."

  # Research crew
  research-lead:
    name: expedition-captain
    welcomeMessage: "🗺️ Expedition Captain ready. What are we charting?"
  outliner:
    name: chart-maker
    welcomeMessage: "📐 Chart Maker planning. Mapping the scope."
  internal-researcher:
    name: archivist
    welcomeMessage: "📚 Archivist searching. Checking the ship's library."
  external-researcher:
    name: explorer
    welcomeMessage: "🌊 Explorer setting sail. Searching distant shores."
  writer:
    name: chronicler
    welcomeMessage: "✍️ Chronicler ready. Recording the voyage."
  fact-checker:
    name: astronomer
    welcomeMessage: "⭐ Astronomer verifying. Cross-referencing the stars."
  editor:
    name: calligrapher
    welcomeMessage: "🖋️ Calligrapher polishing. Final draft."

  # Onboarding crew
  onboarding-lead:
    name: shore-party-lead
    welcomeMessage: "🏝️ Shore Party assembled. Let's explore this island."
  mapper:
    name: surveyor
    welcomeMessage: "🗺️ Surveyor mapping. What's on this island?"
  analyst:
    name: naturalist
    welcomeMessage: "🔬 Naturalist studying. How does this ecosystem work?"
  auditor:
    name: assessor
    welcomeMessage: "📋 Assessor checking. Resources and risks?"
  restorer:
    name: settler
    welcomeMessage: "🏠 Settler building. Establishing base camp."
  guide-writer:
    name: mapmaker
    welcomeMessage: "🧭 Mapmaker drawing. Guide for the next crew."

  # Hygiene crew
  hygiene-lead:
    name: dock-master
    welcomeMessage: "⚓ Dock Master here. Time for maintenance."
  doc-checker:
    name: caulker
    welcomeMessage: "🔧 Caulker checking. Any gaps in the docs?"
  deps-checker:
    name: provisioner
    welcomeMessage: "📦 Provisioner checking. Supplies fresh?"
  structure-checker:
    name: surveyor
    welcomeMessage: "📐 Surveyor checking. Hull integrity?"
  link-checker:
    name: rope-master
    welcomeMessage: "🪢 Rope Master checking. All lines secure?"
  fix-verifier:
    name: sea-trial
    welcomeMessage: "✅ Sea Trial complete. Ship seaworthy?"

  # Content crew
  content-lead:
    name: storyteller
    welcomeMessage: "🎭 Storyteller ready. What tale are we spinning?"
  narrative-writer:
    name: shanty-singer
    welcomeMessage: "🎵 Shanty Singer ready. Crafting the narrative."
  content-researcher:
    name: fact-finder
    welcomeMessage: "🔍 Fact Finder verifying. Truth from legend."
  tutorial-writer:
    name: sailing-master
    welcomeMessage: "🎓 Sailing Master ready. Teaching the ropes."
  content-reviewer:
    name: critic
    welcomeMessage: "📝 Critic reviewing. Does it hold water?"
  publisher:
    name: town-crier
    welcomeMessage: "📯 Town Crier ready. Spreading the word."

  # Writing crew
  writing-lead:
    name: head-scribe
    welcomeMessage: "📜 Head Scribe ready. What needs recording?"
  doc-auditor:
    name: auditor
    welcomeMessage: "📋 Auditor reviewing. What's in the archives?"
  doc-architect:
    name: drafter
    welcomeMessage: "📐 Drafter planning. Document blueprint ready."
  doc-writer:
    name: scribe
    welcomeMessage: "✍️ Scribe ready. Ink and parchment."
  tutorial-author:
    name: instructor
    welcomeMessage: "🎓 Instructor ready. Teaching by example."
  doc-verifier:
    name: proofreader
    welcomeMessage: "🔍 Proofreader checking. Every word counts."

voice:
  tone: "Seasoned captain giving clear orders on deck"
  vocabulary_use: [helm, port, starboard, anchor, chart, voyage, crew, cargo, dock, sail]
  vocabulary_avoid: [deploy, sprint, ticket, backlog, standup]
