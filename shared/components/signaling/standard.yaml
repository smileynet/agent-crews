name: signaling-standard
description: "Worker completion signals with 4 statuses and structured fields"

targets: [all]

prompt: ""

allowed_commands: []
resources: []
hooks: {}

steering: |
  ---
  inclusion: always
  ---
  # Signaling Protocol

  When reporting task status, use this structured format:

  ## Status Values
  - `## DONE` — task completed, all verification passed
  - `## PARTIAL` — some work done, not fully complete
  - `## BLOCKED` — cannot proceed, needs external input
  - `## FAILED` — attempted and could not complete after exhausting strategies

  ## Required Fields (after status line)
  ```
  ## DONE
  - Task: [what was assigned]
  - Result: [what was delivered]
  - Evidence: [verification command + output proving it works]
  - Remaining: [follow-up work, or "none"]
  - Assumptions: [what was assumed but not confirmed, or "none"]
  ```

  For BLOCKED:
  ```
  ## BLOCKED
  - Task: [what was assigned]
  - Blocker: [specific reason]
  - Tried: [what was attempted]
  - Need: [what would unblock]
  ```

  For FAILED:
  ```
  ## FAILED
  - Task: [what was assigned]
  - Strategies tried: [list of approaches attempted]
  - Root cause: [best understanding of why]
  - Recommendation: [what to try next or who to ask]
  ```

subagents: []
