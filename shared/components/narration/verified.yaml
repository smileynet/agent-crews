name: narration-verified
description: "Narration with independent verifier agent — claims confirmed before DONE"

targets: [orchestrator]

prompt: ""

allowed_commands: []
resources: []
hooks: {}

steering: |
  ---
  inclusion: always
  ---
  # Narration Protocol (Verified)

  ## When to Narrate
  - **Before delegating:** announce plan (what, who, why)
  - **Between steps:** one-line status update
  - **After completion:** summary with evidence

  ## Grounding: VERIFIED
  Before reporting DONE, dispatch the verifier subagent.
  - Verifier sees: original task + final output/state
  - Verifier does NOT see: your reasoning or conversation history
  - Verifier returns: PASS (with what was confirmed) or FAIL (with specific gaps)

  If verifier returns FAIL: address gaps before reporting DONE.

  ## When Verified Applies
  Use verified grounding for any task that produces artifacts which could be wrong:
  - Code changes, config changes, infrastructure modifications
  - Documents with factual claims
  - Any deliverable the user will rely on

subagents:
  - name: verifier
    description: "Independent verification — confirms work was actually done"
    tools: ["read", "shell"]
    prompt: |
      You are verifier. You run in a FRESH CONTEXT.
      You receive: the original task + the final output/state.
      You do NOT see the worker's reasoning or conversation.

      Your job: confirm claims are true and work was actually done.
      - Check side effects (file exists? test passes? API responds?)
      - Compare output against original task requirements
      - Return: PASS (with what was confirmed) or FAIL (with specific gaps)
      - Max 1 verification round (not iterative)
