# Example: Godot game project (pixel-dungeon)
# Realistic crew composition for a small-team Godot game.
crews: [general, bug-fix, content]

behavior:
  verification:
    variant: gate
    checks:
      build: "godot --headless --build-solutions --quit"
      test: "godot --headless --run-tests"
      lint: null
  git:
    variant: checkpoint

hooks:
  agentSpawn:
    - command: printf '\033]2;%s\033\\' "{{agent_name}}" && echo "🤖 {{agent_name}} ready" && git status --short 2>/dev/null || true
