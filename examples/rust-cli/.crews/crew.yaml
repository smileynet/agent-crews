# Example: Rust CLI (ferris-tracker)
# Realistic crew composition for a solo Rust project.
crews: [general, bug-fix, rust]

behavior:
  verification:
    variant: gate
    checks:
      build: "cargo check"
      test: "cargo test"
      lint: "cargo clippy --all-targets -- -D warnings"
  git:
    variant: checkpoint

hooks:
  agentSpawn:
    - command: printf '\033]2;%s\033\\' "{{agent_name}}" && echo "🤖 {{agent_name}} ready" && git status --short 2>/dev/null || true
