name: Feature Request
description: Suggest a new crew, component, skill, or improvement
labels: ["enhancement"]
body:
  - type: textarea
    id: problem
    attributes:
      label: What problem does this solve?
      description: Describe the job-to-be-done or pain point.
      placeholder: "When I'm working on X, I need to Y, but currently..."
    validations:
      required: true
  - type: dropdown
    id: category
    attributes:
      label: Category
      options:
        - New crew
        - New component
        - New skill
        - New theme
        - Generator improvement
        - Documentation
        - Other
    validations:
      required: true
  - type: textarea
    id: solution
    attributes:
      label: Proposed solution
      description: How you'd like it to work.
    validations:
      required: false
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
      description: Other approaches you thought about.
    validations:
      required: false
