name: Bug Report
description: Something isn't working as expected
labels: ["bug"]
body:
  - type: textarea
    id: what-happened
    attributes:
      label: What happened?
      description: A clear description of the bug and what you expected instead.
      placeholder: "When I run `just build`, the generator crashes with..."
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Steps to reproduce
      description: Minimal steps to trigger the bug.
      placeholder: |
        1. Set `crews: [general, research]` in fleet.yaml
        2. Run `just build`
        3. See error...
    validations:
      required: true
  - type: dropdown
    id: area
    attributes:
      label: Area
      options:
        - Generator (generate.py)
        - Crew definitions (base/crews/)
        - Components (shared/components/)
        - Themes (shared/themes/)
        - Deployment (just link)
        - Documentation
        - Other
    validations:
      required: true
  - type: textarea
    id: environment
    attributes:
      label: Environment
      description: OS, Python version, kiro-cli version, agent-crews commit.
      value: |
        - OS:
        - Python:
        - kiro-cli:
        - agent-crews commit:
      render: markdown
    validations:
      required: false
  - type: textarea
    id: config
    attributes:
      label: Relevant config
      description: Your fleet.yaml project entry (redact private paths).
      render: yaml
    validations:
      required: false
  - type: textarea
    id: logs
    attributes:
      label: Error output
      description: Paste any error messages or unexpected output.
      render: shell
    validations:
      required: false
